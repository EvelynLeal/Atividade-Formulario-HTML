<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro da Academia</title>
</head>

<body>

<h1>Cadastro da Academia</h1>

<form action="https://webhook.site/26990091-0b5c-4fce-951b-09f66da7313f" method="post">

    <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" name="idade" min="12" max="100" required><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="endereco">Endereço:</label><br>
        <input type="text" id="endereco" name="endereco"><br><br>

        <label for="objetivo">Objetivo:</label><br>
        <textarea id="objetivo" name="objetivo" rows="4" cols="30"></textarea><br><br>

        <label for="inicio">Data de início:</label><br>
        <input type="date" id="inicio" name="inicio">

    </fieldset>

    <br>

    <fieldset>
        <legend>Plano de Treino</legend>

        <label for="dias">Quantos dias por semana pretende treinar?</label><br>

        <select id="dias" name="dias">
            <option value="3 dias">3 dias</option>
            <option value="5 dias">5 dias</option>
            <option value="7 dias">7 dias</option>
        </select>

        <br><br>

        <p>Escolha os dias da semana:</p>

        <input type="checkbox" id="segunda" name="dias_semana" value="Segunda-feira">
        <label for="segunda">Segunda-feira</label><br>

        <input type="checkbox" id="terca" name="dias_semana" value="Terça-feira">
        <label for="terca">Terça-feira</label><br>

        <input type="checkbox" id="quarta" name="dias_semana" value="Quarta-feira">
        <label for="quarta">Quarta-feira</label><br>

        <input type="checkbox" id="quinta" name="dias_semana" value="Quinta-feira">
        <label for="quinta">Quinta-feira</label><br>

        <input type="checkbox" id="sexta" name="dias_semana" value="Sexta-feira">
        <label for="sexta">Sexta-feira</label><br>

        <input type="checkbox" id="sabado" name="dias_semana" value="Sábado">
        <label for="sabado">Sábado</label><br>

        <input type="checkbox" id="domingo" name="dias_semana" value="Domingo">
        <label for="domingo">Domingo</label>

        <br><br>

        <p>Turno preferido:</p>

        <input type="radio" id="manha" name="turno" value="Manhã">
        <label for="manha">Manhã</label><br>

        <input type="radio" id="tarde" name="turno" value="Tarde">
        <label for="tarde">Tarde</label><br>

        <input type="radio" id="noite" name="turno" value="Noite">
        <label for="noite">Noite</label>

    </fieldset>

    <br>

    <input type="submit" value="Cadastrar">

</form>

</body>
</html>
